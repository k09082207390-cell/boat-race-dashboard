<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOAT RACE DASHBOARD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div>
        <h1>BOAT RACE DASHBOARD</h1>
        <p>予想用データを、必要なものだけ。</p>
      </div>
      <div id="todayLabel" class="today-label">----/--/--</div>
    </div>
  </header>

  <main class="app-shell">
    <section id="venueView" class="view">
      <div class="home-heading">
        <div>
          <h2>本日の開催</h2>
          <p>レース場とレース番号を選択</p>
        </div>
        <div id="homeDateLabel" class="home-date">----/--/--</div>
      </div>
      <div id="venueGrid" class="venue-list"></div>
    </section>

    <section id="detailView" class="view hidden">
      <div class="top-nav">
        <button id="backToVenues" class="back-btn" type="button">← 本日の開催</button>
      </div>

      <div class="race-heading">
        <div>
          <h2 id="raceTitle">レース</h2>
          <p id="raceMeta">BOAT RACE公式・実データ</p>
        </div>
      </div>

      <div class="status-bar">
        <div id="fetchStatus" class="fetch-status">データ取得待ち</div>
        <button id="copyBtn" class="copy-btn" type="button">AI用データをコピー</button>
      </div>

      <section class="quick-summary">
        <article class="quick-card">
          <span>イン信頼度</span>
          <strong id="inMark">―</strong>
          <small id="inText">取得待ち</small>
        </article>
        <article class="quick-card">
          <span>2号艇の逃がし</span>
          <strong id="wallMark">―</strong>
          <small id="wallText">取得待ち</small>
        </article>
        <article class="quick-card">
          <span>攻め警戒</span>
          <strong id="attackMark">―</strong>
          <small id="attackText">取得待ち</small>
        </article>
      </section>

      <section class="panel compare-panel">
        <div class="panel-title-row">
          <div>
            <h3>6艇比較</h3>
            <p>まずここだけ見れば全体像が分かる</p>
          </div>
        </div>
        <div id="compareTableWrap" class="table-wrap">
          <div class="loading">読み込み中...</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title-row">
          <div>
            <h3>選手別データ</h3>
            <p>気になる艇だけ開いて確認</p>
          </div>
          <button id="toggleAllBtn" class="subtle-btn" type="button">すべて開く</button>
        </div>
        <div id="playerDetails" class="player-details"></div>
      </section>

      <section class="bottom-grid">
        <article class="panel">
          <h3>気象・水面</h3>
          <dl id="weatherGrid" class="kv"></dl>
        </article>

        <article class="panel">
          <h3>取得状況</h3>
          <dl id="sourceGrid" class="kv"></dl>
        </article>
      </section>

      <section class="panel ai-panel">
        <div class="panel-title-row">
          <div>
            <h3>AI貼り付け用プレビュー</h3>
            <p>ChatGPT予想用</p>
          </div>
          <span id="copyState" class="copy-state">未コピー</span>
        </div>
        <textarea id="aiText" readonly></textarea>
      </section>
    </section>
  </main>

  <div id="toast" class="toast">コピーしました</div>
  <script src="app.js"></script>
</body>
</html>
