<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BOAT RACE AI COPY</title>
  <link rel="stylesheet" href="./style.css?v=1" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">BOAT RACE</p>
        <h1>AI COPY</h1>
        <p class="lead">5ページを一括取得して、AI予想用データをワンクリックでコピー。</p>
      </div>
    </header>

    <section class="panel controls">
      <label>
        <span>日付</span>
        <input id="dateInput" type="date" />
      </label>

      <label>
        <span>場</span>
        <select id="placeSelect"></select>
      </label>

      <label>
        <span>レース</span>
        <select id="raceSelect"></select>
      </label>

      <button id="fetchBtn" class="primary" type="button">
        5ページを取得
      </button>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <p class="eyebrow">STATUS</p>
          <h2>取得状況</h2>
        </div>
        <div id="summaryBadge" class="badge idle">未取得</div>
      </div>

      <div id="statusGrid" class="status-grid"></div>

      <div class="meta-row">
        <span id="elapsedText">取得時間 ―</span>
        <span id="messageText">レースを選んで取得してください</span>
      </div>
    </section>

    <section class="panel copy-panel">
      <button id="copyBtn" class="copy-button" type="button" disabled>
        AI用データをコピー
      </button>
      <span id="copyState" class="copy-state">未コピー</span>
    </section>

    <section class="panel preview-panel">
      <div class="section-head">
        <div>
          <p class="eyebrow">PREVIEW</p>
          <h2>AI用プレビュー</h2>
        </div>
      </div>
      <textarea id="preview" readonly placeholder="ここに5ページ分のAI用データが表示されます。"></textarea>
    </section>
  </main>

  <div id="toast" class="toast">コピーしました</div>

  <script src="./app.js?v=1"></script>
</body>
</html>
